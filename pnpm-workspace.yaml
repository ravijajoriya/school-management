packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@hookform/resolvers@7.0.8'
  - '@nestjs/cli@12.0.15'
  - '@nestjs/common@12.6.0'
  - '@nestjs/core@12.6.0'
  - '@nestjs/platform-express@12.6.0'
  - '@nestjs/schematics@12.0.16'
  - '@nestjs/testing@12.6.0'
  - '@tanstack/query-core@5.108.2'
  - '@tanstack/react-query@5.108.2'
overrides:
  # exceljs pins uuid@8 (GHSA-w5hq-g745-h8pq); 11.x keeps the same CommonJS v4() API.
  uuid: '^11.1.1'
